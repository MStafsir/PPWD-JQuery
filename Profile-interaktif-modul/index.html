<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Profile Interaktif</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
      :root {
        --primary-navy: #1e3a8a;
        --primary-navy-hover: #172554;
        --blue-role: #2563eb;
        --text-dark: #0f172a;
        --text-body: #334155;
        --bg-page: #f8fafc;
        --card-bg: #ffffff;
        --card-border: #e2e8f0;
        --card-border-soft: #dbeafe;
        --success-bg: #ecfdf5;
        --radius-pill: 9999px;
        --radius-card: 22px;
        --radius-inner: 16px;
        --shadow-subtle: 0 10px 25px -5px rgba(37, 99, 235, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
        --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.04);
        --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: var(--bg-page);
        color: var(--text-body);
        line-height: 1.6;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2.5rem 1rem;
      }
      .wrapper {
        width: 100%;
        max-width: 960px;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: var(--radius-card);
        padding: 2.5rem 2.75rem;
        box-shadow: var(--shadow-card);
      }
      .mockup-card {
        background: #ffffff;
        border: 1.5px solid var(--card-border-soft);
        border-radius: var(--radius-inner);
        padding: 2.25rem 2.5rem;
        box-shadow: var(--shadow-subtle);
      }
      .mockup-grid {
        display: grid;
        grid-template-columns: 1fr 1.3fr;
        gap: 2.75rem;
        align-items: start;
      }
      .profile-side, .form-side { display: flex; flex-direction: column; }
      .profile-header-group { display: flex; align-items: center; gap: 1.25rem; margin-bottom: 1.35rem; }
      .avatar-robot {
        width: 76px; height: 76px; border-radius: 50%;
        background: linear-gradient(135deg, #1d4ed8, #2563eb);
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0; box-shadow: 0 4px 14px rgba(29, 78, 216, 0.28);
      }
      .avatar-robot svg { width: 44px; height: 44px; fill: #ffffff; }
      .profile-titles { display: flex; flex-direction: column; }
      .profile-name { font-size: 1.55rem; font-weight: 800; color: var(--text-dark); margin-bottom: 0.15rem; }
      .profile-role { font-size: 1rem; font-weight: 600; color: var(--blue-role); }
      .profile-meta-list { list-style: none; display: flex; flex-direction: column; gap: 0.65rem; margin-bottom: 1.75rem; }
      .profile-meta-item { display: flex; align-items: center; gap: 0.55rem; font-size: 0.95rem; color: #475569; font-weight: 500; }
      .profile-meta-item .meta-icon { font-size: 1.05rem; color: #1e3a8a; display: inline-flex; }
      .form-title-row { display: flex; align-items: center; gap: 0.5rem; font-size: 1.15rem; font-weight: 700; color: var(--text-dark); margin-bottom: 1.25rem; }
      .form-title-row .chat-icon { color: #1e3a8a; }
      .feedback-alert { display: none; padding: 0.85rem 1.15rem; border-radius: 10px; font-size: 0.88rem; font-weight: 600; margin-bottom: 1.25rem; background-color: var(--success-bg); color: #065f46; border: 1px solid #a7f3d0; }
      .input-group { margin-bottom: 1.15rem; }
      .form-input {
        width: 100%; padding: 0.75rem 1.25rem; font-size: 0.95rem; font-family: inherit; color: var(--text-dark);
        background-color: #ffffff; border: 1.5px solid #cbd5e1; border-radius: var(--radius-pill); outline: none; transition: var(--transition);
      }
      .form-input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }
      textarea.form-input { border-radius: 16px; min-height: 85px; resize: vertical; }
      .btn-navy-pill {
        display: inline-flex; align-items: center; justify-content: center; gap: 0.55rem;
        background-color: var(--primary-navy); color: #ffffff; font-size: 0.95rem; font-weight: 700;
        padding: 0.65rem 1.6rem; border-radius: var(--radius-pill); border: none; cursor: pointer;
        box-shadow: 0 4px 12px rgba(30, 58, 138, 0.22); transition: var(--transition); align-self: flex-start;
      }
      .btn-navy-pill:hover { background-color: var(--primary-navy-hover); transform: translateY(-2px); box-shadow: 0 6px 16px rgba(30, 58, 138, 0.32); }
      .btn-outline-pill {
        display: inline-flex; align-items: center; justify-content: center; gap: 0.45rem; background: transparent;
        color: #475569; font-size: 0.88rem; font-weight: 600; padding: 0.5rem 1.15rem; border-radius: var(--radius-pill);
        border: 1.5px solid #cbd5e1; cursor: pointer; transition: var(--transition);
      }
      .btn-outline-pill:hover { background: #f1f5f9; color: #0f172a; border-color: #94a3b8; }
      .edit-profile-box {
        display: none; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 14px;
        padding: 1.25rem; margin-top: 1.25rem; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
      }
      .edit-profile-box h4 { font-size: 0.95rem; font-weight: 700; color: var(--primary-navy); margin-bottom: 0.85rem; display: flex; align-items: center; gap: 0.4rem; }
      .edit-field { margin-bottom: 0.75rem; }
      .edit-field label { display: block; font-size: 0.78rem; font-weight: 700; color: #475569; margin-bottom: 0.25rem; text-transform: uppercase; }
      .edit-field input { width: 100%; padding: 0.45rem 0.85rem; font-size: 0.88rem; font-family: inherit; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; }
      .edit-field input:focus { border-color: #2563eb; }
      .edit-actions { display: flex; gap: 0.5rem; margin-top: 0.85rem; }
      .incoming-messages-box { display: none; margin-top: 1.5rem; padding-top: 1rem; border-top: 1.5px dashed #e2e8f0; }
      .incoming-title { font-size: 0.88rem; font-weight: 700; color: var(--primary-navy); margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.4rem; }
      .message-bubble { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 0.85rem 1rem; margin-bottom: 0.65rem; }
      .message-bubble-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.25rem; font-size: 0.82rem; }
      .message-author { font-weight: 700; color: var(--primary-navy); }
      .message-time { color: #94a3b8; font-size: 0.75rem; }
      .message-email-meta { font-size: 0.78rem; color: #64748b; margin-bottom: 0.35rem; }
      .message-body-text { font-size: 0.88rem; color: #334155; font-style: italic; }
      
      @media (max-width: 820px) {
        .wrapper { padding: 1.75rem 1.25rem; }
        .mockup-grid { grid-template-columns: 1fr; gap: 2rem; }
        .profile-side { border-bottom: 1px dashed #e2e8f0; padding-bottom: 1.75rem; }
      }
    </style>
  </head>
  <body>

    <div class="wrapper">
      <div class="mockup-card" id="mainMockupCard">
        <div class="mockup-grid">

          <!-- BAGIAN KIRI: PROFIL -->
          <div class="profile-side">
            <div id="profileDisplayArea">
              <div class="profile-header-group">
                <div class="avatar-robot" title="Avatar Profil">
                  <!-- Robot SVG -->
                  <svg viewBox="0 0 24 24">
                    <path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.38-1 1.72V7h2a3 3 0 0 1 3 3v2h1a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-1v1a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3v-1H3a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h1v-2a3 3 0 0 1 3-3h2V5.72A1.996 1.996 0 0 1 8 4c0-1.11.89-2 2-2h2zm-3 8a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm6 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm-5 6h4a1 1 0 0 0 0-2H10a1 1 0 0 0 0 2z"/>
                  </svg>
                </div>
                <div class="profile-titles">
                  <h2 class="profile-name" id="viewProfileName">Lintang</h2>
                  <span class="profile-role" id="viewProfileRole">Front-End Developer</span>
                </div>
              </div>

              <ul class="profile-meta-list">
                <li class="profile-meta-item">
                  <span class="meta-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>
                  </span>
                  <span id="viewProfileLocation">Jakarta, Indonesia</span>
                </li>
                <li class="profile-meta-item">
                  <span class="meta-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                  </span>
                  <span id="viewProfileEmail">linlin@gmail.com</span>
                </li>
              </ul>

              <button type="button" class="btn-navy-pill" id="btnUbahProfil">
                <span>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
                </span> Ubah Profil
              </button>
            </div>

            <!-- Bagian Form Edit -->
            <div class="edit-profile-box" id="editProfileBox">
              <h4>
                <span>
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg>
                </span> Edit Data Profil
              </h4>
              <form id="editProfileForm">
                <div class="edit-field">
                  <label>Nama Lengkap</label>
                  <input type="text" id="editNameInput" required>
                </div>
                <div class="edit-field">
                  <label>Pekerjaan / Role</label>
                  <input type="text" id="editRoleInput" required>
                </div>
                <div class="edit-field">
                  <label>Lokasi</label>
                  <input type="text" id="editLocationInput" required>
                </div>
                <div class="edit-field">
                  <label>Email</label>
                  <input type="email" id="editEmailInput" required>
                </div>
                <div class="edit-actions">
                  <button type="submit" class="btn-navy-pill" style="padding: 0.5rem 1.15rem; font-size: 0.85rem;">
                    Simpan Perubahan
                  </button>
                  <button type="button" class="btn-outline-pill" id="btnBatalEdit">
                    Batal
                  </button>
                </div>
              </form>
            </div>
          </div>

          <!-- BAGIAN KANAN: PESAN -->
          <div class="form-side">
            <div class="form-title-row">
              <span class="chat-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
              </span>
              <span>Tinggalkan Pesan</span>
            </div>

            <div class="feedback-alert" id="alertSuccessPesan">
              ✓ Pesan berhasil dikirim ke profil!
            </div>

            <form id="formTinggalkanPesan">
              <div class="input-group">
                <input type="text" class="form-input" id="inputNama" placeholder="Nama Anda" required>
              </div>

              <div class="input-group">
                <input type="email" class="form-input" id="inputEmail" placeholder="Email Anda" required>
              </div>

              <div class="input-group">
                <textarea class="form-input" id="inputPesan" placeholder="Tuliskan pesan Anda di sini..." required></textarea>
              </div>

              <button type="submit" class="btn-navy-pill">
                <span>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
                </span> Kirim
              </button>
            </form>

            <!-- Kotak Tempat Menampilkan Pesan Masuk -->
            <div class="incoming-messages-box" id="incomingBox">
              <div class="incoming-title">
                <span>
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
                </span> Pesan Baru Terkirim:
              </div>
              <div id="messagesContainer"></div>
            </div>
          </div>

        </div>
      </div>
    </div>

    <!-- SCRIPT JQUERY (Dibuat sesederhana mungkin tanpa validasi panjang) -->
    <script>
      $(document).ready(function() {

        // ==========================================
        // 1. FITUR EDIT PROFIL
        // ==========================================

        // Saat tombol "Ubah Profil" diklik
        $('#btnUbahProfil').click(function() {
          // Ambil isi teks profil saat ini dan masukkan ke kotak input form
          $('#editNameInput').val($('#viewProfileName').text());
          $('#editRoleInput').val($('#viewProfileRole').text());
          $('#editLocationInput').val($('#viewProfileLocation').text());
          $('#editEmailInput').val($('#viewProfileEmail').text());
          
          // Tampilkan form editnya dengan animasi menurun
          $('#editProfileBox').slideDown();
        });

        // Saat tombol "Batal" diklik
        $('#btnBatalEdit').click(function() {
          // Sembunyikan form editnya
          $('#editProfileBox').slideUp();
        });

        // Saat form Edit Data Profil di-simpan (disubmit)
        $('#editProfileForm').submit(function(event) {
          event.preventDefault(); // Mencegah reload halaman
          
          // Masukkan teks dari inputan form untuk mengganti teks profil asli
          $('#viewProfileName').text($('#editNameInput').val());
          $('#viewProfileRole').text($('#editRoleInput').val());
          $('#viewProfileLocation').text($('#editLocationInput').val());
          $('#viewProfileEmail').text($('#editEmailInput').val());
          
          // Sembunyikan kembali form edit setelah simpan
          $('#editProfileBox').slideUp();
        });


        // ==========================================
        // 2. FITUR KIRIM PESAN & TAMPILKAN
        // ==========================================

        // Saat form Tinggalkan Pesan di-kirim (disubmit)
        $('#formTinggalkanPesan').submit(function(event) {
          event.preventDefault(); // Mencegah reload halaman
          
          // Ambil teks dari masing-masing inputan form
          let nama = $('#inputNama').val();
          let email = $('#inputEmail').val();
          let pesan = $('#inputPesan').val();
          
          // Tampilkan notifikasi "Pesan Berhasil Terkirim" sesaat
          $('#alertSuccessPesan').fadeIn().delay(2000).fadeOut();

          // Buat elemen desain HTML untuk menampilkan pesan baru
          let bubblePesan = `
            <div class="message-bubble">
              <div class="message-bubble-header">
                <span class="message-author">${nama}</span>
                <span class="message-time">Baru Saja</span>
              </div>
              <div class="message-email-meta">${email}</div>
              <div class="message-body-text">"${pesan}"</div>
            </div>
          `;

          // Tampilkan kotak pembungkus daftar pesan (jika sebelumnya masih tersembunyi)
          $('#incomingBox').show();

          // Tambahkan bubble pesan ke dalam kontainer (prepend = masuk paling atas)
          $('#messagesContainer').prepend(bubblePesan);

          // Hapus atau kosongkan isi form setelah dikirim
          $('#formTinggalkanPesan')[0].reset();
        });

      });
    </script>
  </body>
</html>
