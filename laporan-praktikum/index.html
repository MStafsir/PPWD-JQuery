<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Praktikum Pemrograman Web Dasar</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: var(--card-bg);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1.25rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header-title h1 {
            font-size: 1.35rem;
            font-weight: 700;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-title p {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .actions {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.55rem 1.15rem;
            border-radius: 999px;
            font-size: 0.875rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-download {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
        }

        .btn-download:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        main {
            flex: 1;
            padding: 1.5rem 2rem;
            display: flex;
            flex-direction: column;
        }

        .pdf-container {
            flex: 1;
            min-height: 78vh;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        iframe {
            width: 100%;
            height: 100%;
            min-height: 78vh;
            border: none;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-title">
            <h1>📄 Laporan Praktikum Pemrograman Web Dasar</h1>
            <p>H1101251016 · Muhamad Sholichin Tafsir Srilintang · Kelas Praktikum Sistem Informasi A</p>
        </div>
        <div class="actions">
            <a href="../index.html" class="btn btn-back">&larr; Portofolio</a>
            <a href="laporan-praktikum-final.pdf" download class="btn btn-download">⬇ Unduh PDF</a>
        </div>
    </header>

    <main>
        <div class="pdf-container">
            <iframe src="laporan-praktikum-final.pdf" type="application/pdf">
                <p style="padding: 2rem; text-align: center; color: #333;">
                    Browser Anda tidak mendukung preview PDF langsung. 
                    <a href="laporan-praktikum-final.pdf" download style="color: #0284c7; font-weight: 600;">Klik di sini untuk mengunduh dokumen.</a>
                </p>
            </iframe>
        </div>
    </main>
</body>
</html>
