<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Hubungi Saya - Formulir Kontak Mahasiswa Sistem Informasi.">
  <title>Contact — MyPortofolio</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a href="../index.html" title="Kembali ke portal utama" style="position:fixed;left:16px;bottom:16px;z-index:99999;padding:10px 16px;border-radius:999px;background:rgba(15,23,42,.85);color:#fff;font:600 14px/1 system-ui,sans-serif;text-decoration:none;box-shadow:0 6px 20px rgba(0,0,0,.35);backdrop-filter:blur(6px)">&larr; Portofolio</a>
  <!-- Fullscreen interactive morning cloud background -->
  <canvas id="cloud-canvas"></canvas>
  <div id="cloud-overlay"></div>
  <div id="cloud-fallback" class="cloud-fallback" aria-hidden="true"></div>

  <!-- Navigasi -->
  <nav>
    <div class="container">
      <div class="logo">MyPortofolio</div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
        <li><a href="../index.html" style="color: #818cf8; font-weight: 700;">&larr; Portal</a></li>
      </ul>
    </div>
  </nav>

  <!-- Header Halaman -->
  <header class="page-header">
    <div class="container">
      <h1>Hubungi Saya</h1>
      <p>Kirimkan pesan, pertanyaan, atau ajakan kolaborasi</p>
    </div>
  </header>

  <!-- Konten Utama -->
  <main class="content-section">
    <div class="container">
      <div class="card-panel">
        <form id="contact-form" action="#" method="POST" onsubmit="handleContactSubmit(event)">
          <div class="form-group">
            <label for="name">Nama Lengkap</label>
            <input type="text" id="name" name="name" class="form-control" placeholder="Masukkan nama Anda" required>
          </div>

          <div class="form-group">
            <label for="email">Alamat Email</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="nama@email.com" required>
          </div>

          <div class="form-group">
            <label for="message">Pesan</label>
            <textarea id="message" name="message" class="form-control" rows="5" placeholder="Tuliskan pesan Anda di sini..." required></textarea>
          </div>

          <button type="submit" class="btn" id="submit-btn">Kirim Pesan</button>
          <div id="form-feedback" style="margin-top: 16px; font-weight: 500; display: none;" role="status" aria-live="polite"></div>
        </form>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 MyPortofolio</p>
  </footer>

  <script src="js/main.js"></script>
  <script>
    function handleContactSubmit(event) {
      event.preventDefault();
      const feedback = document.getElementById('form-feedback');
      const submitBtn = document.getElementById('submit-btn');
      
      feedback.style.display = 'block';
      feedback.style.color = '#15803d';
      feedback.textContent = 'Terima kasih! Pesan Anda berhasil dikirim.';
      
      event.target.reset();
      submitBtn.disabled = true;
      setTimeout(() => {
        submitBtn.disabled = false;
      }, 3000);
    }
  </script>
</body>
</html>
